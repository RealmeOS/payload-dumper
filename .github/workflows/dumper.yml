name: 提取镜像文件

on:
  workflow_dispatch:
    inputs:
      img:
        description: '需要解包的分区'
        required: true
        default: 'boot,vbmeta'
      url:
        description: '全量包链接'
        required: true
      note:
        description: '备注(可选)'
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
    - name: 安装必要软件包
      run: |
        sudo apt update
        sudo apt install aria2 brotli curl git jq python3 unzip zip -y

    - name: 下载解压工具包
      run: |
        curl -s https://api.github.com/repos/sekaiacg/payload_extract/releases/latest | jq -r '.assets[] | select(.name | contains("Linux_x86_64")) | .browser_download_url' | xargs aria2c -o payload_extract.zip
        unzip -o payload_extract.zip

    - name: 开始解包
      run: |
        mkdir output
        if ./payload_extract -i "${{ github.event.inputs.url }}" -p | grep -q "SecurityPatchLevel"
        then
          ./payload_extract -i "${{ github.event.inputs.url }}" -T6 -k -o output -X ${{ github.event.inputs.img }}
        else
          aria2c --check-certificate=false -c -x 16 -s 16 -o rom.zip "${{ github.event.inputs.url }}"
          aria2c -c https://raw.githubusercontent.com/xpirt/sdat2img/refs/heads/master/sdat2img.py
          img=${{ github.event.inputs.img }}
          unzip -l rom.zip
          for partitions in ${img//,/ }
          do
            if unzip -l rom.zip | grep -q "${partitions}.new.dat.br"
            then
              unzip -j rom.zip "$(unzip -l rom.zip | grep "${partitions}.new.dat.br" | awk '{print $4}')"
              unzip -j rom.zip "$(unzip -l rom.zip | grep "${partitions}.transfer.list" | awk '{print $4}')"
              brotli -d "${partitions}.new.dat.br"
              python3 sdat2img.py "${partitions}.transfer.list" "${partitions}.new.dat" "output/${partitions}.img"
              rm -f ${partitions}.*
            elif unzip -l rom.zip | grep -q "${partitions}.new.dat"
            then
              unzip -j rom.zip "$(unzip -l rom.zip | grep "${partitions}.new.dat" | awk '{print $4}')"
              unzip -j rom.zip "$(unzip -l rom.zip | grep "${partitions}.transfer.list" | awk '{print $4}')"
              python3 sdat2img.py "${partitions}.transfer.list" "${partitions}.new.dat" "output/${partitions}.img"
              rm -f ${partitions}.*
            elif unzip -l rom.zip | grep -qwE "${partitions}\.[a-zA-Z]{3}"
            then
              unzip -j rom.zip "$(unzip -l rom.zip | grep -wE "${partitions}\.[a-zA-Z]{3}" | awk '{print $4}')" -d output
            fi
          done
        fi
        cd output && zip -m out.zip *

    - name: 上传到Release
      uses: softprops/action-gh-release@v2
      with:
          tag_name: ${{ github.event.inputs.note || github.run_id }}
          files: |
            output/out.zip

    - name: 清理旧文件
      uses: ophub/delete-releases-workflows@main
      with:
        workflows_keep_day: 0
        releases_keep_latest: 3
        delete_tags: true
        delete_workflows: true
        delete_releases: true
        gh_token: ${{ secrets.GITHUB_TOKEN }}
